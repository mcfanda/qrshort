<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - QR Short URL</title>
    <style>
      :root {
        color: #202124;
        background: #f7f8f3;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: linear-gradient(180deg, #f7f8f3 0%, #ffffff 50%, #edf7f0 100%);
        color: #202124;
      }

      main {
        width: min(420px, calc(100% - 32px));
      }

      form {
        border: 1px solid #ccd8d0;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 34px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      label {
        display: block;
        margin: 0 0 8px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 48px;
        margin: 0 0 18px;
        border: 1px solid #aeb9b2;
        border-radius: 8px;
        padding: 10px 12px;
        color: #202124;
        font: inherit;
        letter-spacing: 0;
      }

      input:focus {
        border-color: #157347;
        outline: 3px solid #d6f2df;
      }

      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: #157347;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 12px 18px;
        letter-spacing: 0;
      }

      .status {
        min-height: 24px;
        margin-top: 16px;
        color: #b3261e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <form id="login-form">
        <h1>Log in.</h1>
        <label for="password">Admin password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Log in</button>
        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </main>

    <script>
      const form = document.querySelector("#login-form");
      const status = document.querySelector("#status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "";
        const password = new FormData(form).get("password");

        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({password})
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || "Could not log in.");
          }
          window.location.href = "/";
        } catch (error) {
          status.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
